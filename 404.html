<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found — Arav Shah</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0806">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0806'/><circle cx='16' cy='16' r='8.5' fill='none' stroke='%23d9b45a' stroke-width='3.2'/></svg>">
<script>document.documentElement.classList.add('js');</script>
<style>
  .lost{
    position:relative; z-index:1;
    min-height:100svh;
    display:grid; place-content:center; justify-items:center;
    gap:var(--space-4);
    padding:var(--gutter);
    text-align:center;
  }
  .lost-code{
    margin:0;
    font-family:var(--font-pixel);
    font-size:var(--text-sm);
    letter-spacing:.2em;
    color:var(--gold-bright);
  }
  .lost h1{
    margin:0;
    max-width:12ch;
    font-family:var(--font-display);
    font-size:clamp(3.25rem, 2rem + 6vw, 7.5rem);
    font-weight:500;
    line-height:.9;
    letter-spacing:-.03em;
    text-wrap:balance;
    text-shadow:0 2px 30px rgba(0,0,0,.85), 0 0 calc(var(--flash, 0) * 40px) rgba(240,207,122,calc(var(--flash, 0) * .5));
  }
  .lost p{ margin:0; max-width:28em; color:var(--text); text-wrap:balance; text-shadow:0 1px 14px rgba(0,0,0,.95); }
  .lost a{
    margin-top:var(--space-5);
    padding:var(--space-2) var(--space-5);
    border:1px solid var(--gold-line);
    border-radius:var(--radius-pill);
    background:rgba(10,8,6,.75);
    font-family:var(--font-chrome);
    font-size:var(--text-sm);
    letter-spacing:var(--tracking-label);
    color:var(--gold-bright);
    transition:border-color var(--dur-base) var(--ease), background-color var(--dur-base) var(--ease);
  }
  .lost a:hover{ border-color:var(--gold-bright); background:rgba(20,13,4,.9); }
  html.no-stage body{ background:#0a0806 url(/assets/shire.jpg) center / cover; background-blend-mode:multiply; }
</style>
</head>
<body>
<main class="lost">
  <p class="lost-code">404</p>
  <h1>Not all who wander are lost.</h1>
  <p>But this page is. Whatever you were looking for isn&rsquo;t here.</p>
  <a href="/">&larr; back to the shire</a>
</main>
<script type="module" src="/src/notfound.js"></script>
</body>
</html>
