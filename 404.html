<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Arav Shah</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0b09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230c0b09'/><circle cx='16' cy='16' r='8.5' fill='none' stroke='%23d9b45a' stroke-width='3.2'/></svg>">
<style>
  .lost{
    position:relative; z-index:1;
    min-height:100svh;
    display:grid; place-content:center; justify-items:center;
    gap:var(--space-4);
    padding:var(--gutter);
    text-align:center;
  }
  .lost svg{ color:var(--gold); filter:drop-shadow(0 0 10px rgba(240,207,122,.35)); }
  .lost h1{
    margin:0;
    font-size:var(--text-3xl);
    font-weight:var(--weight-semibold);
    line-height:var(--leading-display);
    letter-spacing:var(--tracking-display);
  }
  .lost p{ margin:0; max-width:28em; color:var(--text-muted); text-wrap:balance; }
  .lost a{
    margin-top:var(--space-4);
    font-family:var(--font-chrome);
    font-size:var(--text-sm);
    letter-spacing:var(--tracking-label);
    color:var(--gold-bright);
    border-bottom:1px solid var(--gold-line);
    padding-bottom:2px;
    transition:border-color var(--dur-base) var(--ease);
  }
  .lost a:hover{ border-color:var(--gold-bright); }
</style>
</head>
<body>
<main class="lost">
  <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
    <circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="2.4"/>
  </svg>
  <p class="label">404</p>
  <h1>Not all who wander are lost.</h1>
  <p>But this page is. Whatever you were looking for isn&rsquo;t here.</p>
  <a href="/">&larr; back to the shire</a>
</main>
</body>
</html>
